; t5-epaper-navi: LilyGO T5 E-Paper S3 Pro (H752-01) 向けファームウェア
; 仕様は SPEC.md を参照

[platformio]
boards_dir = boards

[env:t5-epaper-s3-pro]
platform = espressif32@6.9.0
board = T5-ePaper-S3
framework = arduino

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    m5stack/M5GFX@^0.2.24
    lewisxhe/SensorLib@0.2.2
    mikalhart/TinyGPSPlus@^1.1.0
